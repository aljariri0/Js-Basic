<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library System</title>
  </head>
  <body>
    <script>
      function validate_data() {
        let membership = prompt("Enter your membership (student, regular):");

        while (membership != "student" && membership != "regular") {
          membership = prompt(
            "Invalid Enter your membership again (student, regular):",
          );
        }

        return membership;
      }
      function collect_all_user_data() {
        let userName = prompt("Enter your name:");

        membership = validate_data();

        alert("Welcome " + userName + "! Your membership is: " + membership);

        let bookType = prompt(
          "Enter your preferred book type (Fiction or Non-fiction):",
        );
        let bookName = prompt("Enter the name of the book you want to borrow:");

        const info = [userName, membership, bookType, bookName];

        return info;
      }

      function applyDiscount(userData) {
        if (userData[1] == "student") {
          userData.push("20% Discount");
        } else if (userData[1] == "regular") {
          userData.push("No Discount");
        }

        return userData;
      }

      // applyDiscount(collect_all_user_data())
      const availableGenres = [];

      function addNewGenre(genre) {
        availableGenres.push(genre);
      }

      function displayGenres() {
        console.log("We offer: ");

        for (let i = 0; i < availableGenres.length; i++) {
          console.log(availableGenres[i]);
        }
      }

      for (let i = 0; i < info.length; i++) {
        console.log(info[i]);
      }
    </script>
  </body>
</html>
