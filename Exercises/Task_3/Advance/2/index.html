<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Use a Test Score array</h1>

    <label for="name">Name: </label>
    <input type="text" id="name"  autofocus/><br />

    <label for="score">Score: </label>
    <input type="text" id="score" /><br /><br />

    <button type="button">Add to Array</button>
    <button type="button">Display Results</button>
    <button type="button">Display Scores</button>

    <div id="results">
      <h2>Results</h2>
    </div>
    <h2>Scores</h2>
    <table id="scores_table">
      <tr>
        <th>Name</th>
        <th>Score</th>
      </tr>

    </table>
  </body>
</html>
